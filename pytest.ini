# pytest.ini - Configuration for pytest test runs
[pytest]
asyncio_mode = auto
addopts =
    -v
    --html=dummy.html
    --self-contained-html
    --junitxml=dummy.xml
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests/
markers =
    smoke: smoke tests
    critical: critical tests
    negative: negative tests
    security: security tests (injection, XSS, headers)
    performance: performance tests
